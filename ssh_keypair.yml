---
# Create an SSH key pair and store it in Bitwarden Secrets Manager.
#
# Key settings come from inventory/group_vars/all/ssh.yml. The bitwarden role
# stores the two secrets, <ssh_key_name>_private_key and <ssh_key_name>_public_key,
# and records their IDs in that same file as <secret name>_bws_id (commit it in
# lab1inventory).
#
# A key pair whose two IDs are already set is kept. To rotate it (same secret
# IDs, new values):
#   ansible-playbook ssh_keypair.yml -e force=true

- name: Create an SSH key pair and publish it to Bitwarden
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ssh_key_name: lab1
    ssh_keypair_force: "{{ force | default(false) | bool }}"
    ssh_keypair_vars_file: "{{ playbook_dir }}/inventory/group_vars/all/ssh.yml"
    ssh_keypair_secrets:
      - part: private
        name: "{{ ssh_key_name }}_private_key"
        file: key
      - part: public
        name: "{{ ssh_key_name }}_public_key"
        file: key.pub

  tasks:
    # Decided once: the bitwarden role sets the *_bws_id vars, and the block's
    # condition is checked again for each task, including the cleanup.
    - name: ssh_keypair.yml | Check whether a new key pair is needed
      ansible.builtin.set_fact:
        ssh_keypair_needed: >-
          {{ ssh_keypair_force
             or lookup('ansible.builtin.vars', ssh_key_name ~ '_private_key_bws_id', default='') == ''
             or lookup('ansible.builtin.vars', ssh_key_name ~ '_public_key_bws_id', default='') == '' }}

    - name: ssh_keypair.yml | Generate and publish a new key pair
      when: ssh_keypair_needed | bool
      block:
        # Generated even in check mode so the rest of the play can run; it is
        # only a temporary file.
        - name: ssh_keypair.yml | Create a temporary directory for the key pair
          ansible.builtin.tempfile:
            state: directory
            suffix: ssh_keypair
          register: ssh_keypair_tmp
          check_mode: false

        - name: ssh_keypair.yml | Generate the key pair
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -q
              - -t
              - "{{ ssh_key_type }}"
              - -N
              - ""
              - -C
              - "{{ ssh_key_name }}"
              - -f
              - "{{ ssh_keypair_tmp.path }}/key"
          changed_when: true
          check_mode: false

        - name: ssh_keypair.yml | Read the key pair
          ansible.builtin.slurp:
            src: "{{ ssh_keypair_tmp.path }}/{{ item.file }}"
          loop: "{{ ssh_keypair_secrets }}"
          loop_control:
            label: "{{ item.file }}"
          register: ssh_keypair_files
          no_log: true

        - name: ssh_keypair.yml | Publish the key pair to Bitwarden
          ansible.builtin.include_role:
            name: bitwarden
          vars:
            bitwarden_action: put
            bitwarden_secret_name: "{{ item.item.name }}"
            bitwarden_secret_content: "{{ item.content | b64decode }}"
            bitwarden_secret_note: "SSH {{ ssh_key_type }} {{ item.item.part }} key, created by ssh_keypair.yml"
            bitwarden_secret_force: "{{ ssh_keypair_force }}"
            bitwarden_secret_id_file: "{{ ssh_keypair_vars_file }}"
          loop: "{{ ssh_keypair_files.results }}"
          loop_control:
            label: "{{ item.item.name }}"

        # Local copy for ansible.cfg's private_key_file; gitignored.
        - name: ssh_keypair.yml | Write the private key to .ansible_ssh_key
          ansible.builtin.copy:
            content: >-
              {{ (ssh_keypair_files.results
                  | selectattr('item.part', 'equalto', 'private')
                  | first).content | b64decode }}
            dest: "{{ playbook_dir }}/.ansible_ssh_key"
            mode: "0600"
          no_log: true

      always:
        - name: ssh_keypair.yml | Remove the temporary key pair
          ansible.builtin.file:
            path: "{{ ssh_keypair_tmp.path }}"
            state: absent
          when: ssh_keypair_tmp.path is defined
          check_mode: false
