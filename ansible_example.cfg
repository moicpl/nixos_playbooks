# Example Ansible configuration for nixos_playbooks.
#
# Copy it to ansible.cfg (local, gitignored) and run playbooks from this
# directory: Ansible only reads ansible.cfg from the current working directory
# (or from $ANSIBLE_CONFIG). Relative paths below resolve from this file's directory.

[defaults]
# Symlink to ../lab1inventory
inventory = inventory

# Role symlinks created by workspace_setup.yml (bitwarden). Leaves out
# ~/.ansible/roles so old galaxy copies there can't shadow the git clones.
roles_path = roles

# moicpl.nixos and moicpl.app_config: symlinks to their git clones, created by
# workspace_setup.yml, first so they win over any installed copy. The galaxy
# collections (bitwarden.secrets, community.sops) are in ~/.ansible/collections.
collections_path = collections:~/.ansible/collections:/usr/share/ansible/collections

# Lab hosts get rebuilt often, so their SSH host keys change.
host_key_checking = False

# Holds the password that decrypts bw_lab1_master_token (CLAUDE.md rule 3).
# Created with mode 0600 by workspace_setup.yml, which prompts for the password,
# and gitignored. To change it, delete the file and rerun workspace_setup.yml.
vault_password_file = .ansible_vault_pswd

# SSH key written from Bitwarden (ssh_keypair.yml, and the nixos role's
# connect.yml on every run). Never commit it.
private_key_file = .ansible_ssh_key

[privilege_escalation]
become_method = sudo
become_user = root
